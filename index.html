  /* ----- Result Card Styles ----- */
.result-card {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.result-header {
    background: #0d6efd;      /* Bootstrap primary blue */
    color: #fff;
    font-size: 1.25rem;
    font-weight: 600;
    padding: 12px 20px;
    text-align: center;
    letter-spacing: 0.5px;
}

/* ----- Student Details Table (vertical) ----- */
.detail-table {
    margin: 0 !important;
    border-collapse: collapse;
    width: 100%;
}

.detail-table td {
    padding: 10px 18px;
    border: 1px solid #dee2e6;
    vertical-align: middle;
}

.detail-table td:first-child {
    background: #f8f9fa;
    font-weight: 600;
    width: 38%;
    color: #212529;
}

.detail-table td:last-child {
    background: #fff;
    width: 62%;
}


/* ----- Subject Table ----- */
.subject-table {
    margin: 0 !important;
    border-collapse: collapse;
    width: 100%;
}

.subject-table thead th {
    background:#D0E3FE;
    font-weight: 600;
    text-align: center;
    padding: 10px 12px;
    border: 1px solid #dee2e6;
    font-size: 0.95rem;
}

.subject-table tbody td {
    padding: 8px 12px;
    border: 1px solid #dee2e6;
    text-align: center;
    vertical-align: middle;
}

.subject-table tbody tr:nth-child(even) {
    background-color: #f8f9fa;
}

/* ----- "Search Another Result" link ----- */
.search-another {
    padding: 16px 20px 20px 20px;
    text-align: center;
    border-top: 1px solid #dee2e6;
    background: #fff;
}

.search-another a {
    color: #0d6efd;
    text-decoration: none;
    font-weight: 500;
}

.search-another a:hover {
    text-decoration: underline;
}

.detail-table td:last-child {
    background: #fff;
    width: 62%;
    white-space: nowrap;   /* <-- This forces the text to stay on one line */
    overflow: hidden;      /* <-- Hides any overflow (optional) */
    text-overflow: ellipsis; /* <-- Adds "..." if the text is too long (optional) */
}
